<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Cleaner Web Vercel</title>
  <style>
    body { font-family: monospace; background: #0f0f0f; color: #fff; padding: 15px; max-width: 500px; margin: auto; }
    h2 { color: #e1306c; text-align: center; margin-bottom: 15px; }
    .card { background: #1a1a1a; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 15px; }
    
    /* Wizard Steps Style */
    .step-badge { background: #333; color: #007bff; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-bottom: 8px; display: inline-block; }
    .step-title { font-size: 12px; color: #fff; margin-bottom: 8px; font-weight: bold; }
    
    .input-box { display: flex; gap: 6px; }
    input { flex: 1; padding: 10px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 11px; }
    .btn-next { background: #007bff; color: #fff; border: none; padding: 10px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 11px; }
    
    .cookie-preview { background: #111; border: 1px dashed #444; padding: 8px; border-radius: 4px; margin-top: 10px; font-size: 10px; color: #aaa; }
    .cookie-preview span { color: #2ecc71; word-break: break-all; }
    
    #cookieStatus { margin-top: 10px; font-size: 11px; padding: 8px 10px; border-radius: 4px; display: none; font-weight: bold; }
    .status-success { background: rgba(40, 167, 69, 0.2); border: 1px solid #28a745; color: #2ecc71; }
    .status-error { background: rgba(220, 53, 69, 0.2); border: 1px solid #dc3545; color: #ff4d4d; }
    .status-loading { background: rgba(255, 193, 7, 0.2); border: 1px solid #ffc107; color: #f1c40f; }

    .btn-group { display: flex; gap: 8px; margin-top: 12px; }
    button { flex: 1; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: #fff; }
    #removeBtn { background: #e1306c; }
    #unfollBtn { background: #28a745; }
    #pauseBtn { background: #e67e22; }
    #stopBtn { background: #dc3545; }
    .btn-reset { background: #444; color: #ccc; padding: 4px 8px; border-radius: 4px; border: none; cursor: pointer; font-size: 10px; margin-top: 6px; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    
    #logContainer { background: #000; padding: 10px; border-radius: 8px; border: 1px solid #333; height: 250px; overflow-y: auto; font-size: 11px; margin-top: 12px; }
    p { margin: 3px 0; line-height: 1.3; }
  </style>
</head>
<body>

  <h2>🤖 IG CLEANER WEB</h2>

  <div class="card">
    <div id="stepBadge" class="step-badge">LANGKAH 1 DARI 3</div>
    <div id="stepTitle" class="step-title">Masukkan ds_user_id</div>
    
    <div class="input-box">
      <input type="text" id="stepInput" placeholder="Contoh: 68490281081" onkeypress="if(event.key==='Enter') handleNextStep()">
      <button id="nextBtn" class="btn-next" onclick="handleNextStep()">Lanjut ➔</button>
    </div>

    <!-- Preview Cookie Terkumpul -->
    <div class="cookie-preview">
      <div>ds_user_id: <span id="prevUserId">-</span></div>
      <div>sessionid: <span id="prevSessionId">-</span></div>
      <div>csrftoken: <span id="prevCsrfToken">-</span></div>
      <button class="btn-reset" onclick="resetWizard()">🔄 Reset / Ulangi</button>
    </div>

    <div id="cookieStatus"></div>

    <div class="btn-group">
      <button id="removeBtn" onclick="startCleaner('REMOVE_FOLLOWERS')" disabled>Hapus Followers</button>
      <button id="unfollBtn" onclick="startCleaner('UNFOLLOW_NON_MUTUAL')" disabled>Unfollow Following</button>
    </div>
    
    <div class="btn-group">
      <button id="pauseBtn" onclick="togglePause()" disabled>Pause</button>
      <button id="stopBtn" onclick="stopProcess()" disabled>Stop</button>
    </div>
  </div>

  <div id="logContainer"></div>

  <script>
    let currentStep = 1;
    let cookieData = { ds_user_id: '', sessionid: '', csrftoken: '' };
    let fullCookieString = '';
    let isPaused = false;
    let isStopped = false;
    let isCookieValid = false;

    function printLog(text, color = '#fff') {
      const logBox = document.getElementById('logContainer');
      const p = document.createElement('p');
      p.style.color = color;
      p.innerText = `[${new Date().toLocaleTimeString()}] ${text}`;
      logBox.appendChild(p);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function setStatus(text, type) {
      const statusBox = document.getElementById('cookieStatus');
      statusBox.className = `status-${type}`;
      statusBox.style.display = 'block';
      statusBox.innerText = text;
    }

    // Wizard Logic Input Bertahap
    function handleNextStep() {
      const inputEl = document.getElementById('stepInput');
      let val = inputEl.value.trim();

      if (!val) {
        alert("Mohon isi bidang ini terlebih dahulu!");
        return;
      }

      // Deteksi jika pengguna langsung mempaste seluruh cookie sekaligus
      if (val.includes('ds_user_id=') && val.includes('sessionid=')) {
        cookieData.ds_user_id = val.match(/ds_user_id=([^;]+)/)?.[1] || '';
        cookieData.sessionid = val.match(/sessionid=([^;]+)/)?.[1] || '';
        cookieData.csrftoken = val.match(/csrftoken=([^;]+)/)?.[1] || '';
        currentStep = 4;
      } else {
        // Pembersihan nilai jika user tak sengaja paste format key=value
        if (currentStep === 1) {
          cookieData.ds_user_id = val.match(/ds_user_id=([^;]+)/)?.[1] || val;
          currentStep = 2;
        } else if (currentStep === 2) {
          cookieData.sessionid = val.match(/sessionid=([^;]+)/)?.[1] || val;
          currentStep = 3;
        } else if (currentStep === 3) {
          cookieData.csrftoken = val.match(/csrftoken=([^;]+)/)?.[1] || val;
          currentStep = 4;
        }
      }

      inputEl.value = '';
      updateWizardUI();

      if (currentStep === 4) {
        finishAndVerifyCookie();
      }
    }

    function updateWizardUI() {
      const badge = document.getElementById('stepBadge');
      const title = document.getElementById('stepTitle');
      const inputEl = document.getElementById('stepInput');
      const nextBtn = document.getElementById('nextBtn');

      document.getElementById('prevUserId').innerText = cookieData.ds_user_id || '-';
      document.getElementById('prevSessionId').innerText = cookieData.sessionid ? (cookieData.sessionid.substring(0, 15) + '...') : '-';
      document.getElementById('prevCsrfToken').innerText = cookieData.csrftoken ? (cookieData.csrftoken.substring(0, 15) + '...') : '-';

      if (currentStep === 1) {
        badge.innerText = "LANGKAH 1 DARI 3";
        title.innerText = "Masukkan ds_user_id";
        inputEl.placeholder = "Contoh: 68490281081";
        inputEl.disabled = false;
        nextBtn.innerText = "Lanjut ➔";
      } else if (currentStep === 2) {
        badge.innerText = "LANGKAH 2 DARI 3";
        title.innerText = "Masukkan sessionid";
        inputEl.placeholder = "Contoh: 68490281081%3AT6pRDt4...";
        inputEl.disabled = false;
        nextBtn.innerText = "Lanjut ➔";
      } else if (currentStep === 3) {
        badge.innerText = "LANGKAH 3 DARI 3";
        title.innerText = "Masukkan csrftoken";
        inputEl.placeholder = "Contoh: P7euvEaRIUjzL-gka0pZKT";
        inputEl.disabled = false;
        nextBtn.innerText = "Selesai & Cek ✓";
      } else if (currentStep === 4) {
        badge.innerText = "SELESAI";
        title.innerText = "Semua Cookie Terkumpul";
        inputEl.placeholder = "Pengecekan selesai...";
        inputEl.disabled = true;
        nextBtn.innerText = "Terverifikasi";
      }
    }

    function resetWizard() {
      currentStep = 1;
      cookieData = { ds_user_id: '', sessionid: '', csrftoken: '' };
      fullCookieString = '';
      isCookieValid = false;
      document.getElementById('cookieStatus').style.display = 'none';
      document.getElementById('removeBtn').disabled = true;
      document.getElementById('unfollBtn').disabled = true;
      document.getElementById('stepInput').value = '';
      updateWizardUI();
      printLog("[SYSTEM] Wizard direset. Silakan masukkan cookie kembali.", "#ffaa00");
    }

    async function finishAndVerifyCookie() {
      fullCookieString = `ds_user_id=${cookieData.ds_user_id}; sessionid=${cookieData.sessionid}; csrftoken=${cookieData.csrftoken}; mid=akt2NQABAAEUOa|DIOpZdBicS|4P`;
      await verifyCookie();
    }

    async function proxyFetch(targetUrl, method = 'GET', payload = null) {
      const csrfToken = cookieData.csrftoken;

      const res = await fetch('/api/proxy', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-CSRFToken': csrfToken,
          'X-Cookie': fullCookieString
        },
        body: JSON.stringify({ targetUrl, method, payload })
      });

      return res;
    }

    async function verifyCookie() {
      if (!cookieData.ds_user_id || !cookieData.sessionid || !cookieData.csrftoken) {
        setStatus("❌ Data Cookie belum lengkap!", "error");
        return false;
      }

      setStatus("⏳ Menguji koneksi cookie ke Instagram...", "loading");

      try {
        const testUrl = `https://www.instagram.com/api/v1/friendships/${cookieData.ds_user_id}/following/?count=1`;
        const res = await proxyFetch(testUrl);

        if (res.ok) {
          const data = await res.json();
          if (data.status === 'ok') {
            setStatus(`✅ Cookie Valid! ID User: ${cookieData.ds_user_id}`, "success");
            isCookieValid = true;
            document.getElementById('removeBtn').disabled = false;
            document.getElementById('unfollBtn').disabled = false;
            printLog(`[SYSTEM] Cookie terverifikasi untuk User ID: ${cookieData.ds_user_id}`, "#00ff00");
            return true;
          }
        }
        
        setStatus(`❌ Cookie Kadaluarsa / Akses Ditolak (HTTP ${res.status})`, "error");
        isCookieValid = false;
        return false;

      } catch (err) {
        setStatus(`❌ Gagal terhubung ke proxy: ${err.message}`, "error");
        isCookieValid = false;
        return false;
      }
    }

    function togglePause() {
      isPaused = !isPaused;
      const btn = document.getElementById('pauseBtn');
      btn.innerText = isPaused ? "Resume" : "Pause";
      btn.style.background = isPaused ? "#2ecc71" : "#e67e22";
      printLog(isPaused ? "[KONTROL] Dijeda." : "[KONTROL] Melanjutkan...", "#f1c40f");
    }

    function stopProcess() {
      isStopped = true;
      printLog("[KONTROL] Proses dihentikan.", "#dc3545");
    }

    async function checkControlState() {
      while (isPaused && !isStopped) {
        await new Promise(r => setTimeout(r, 1000));
      }
    }

    async function startCleaner(mode) {
      if (!isCookieValid) {
        alert("Lengkapi dan verifikasi cookie terlebih dahulu!");
        return;
      }

      const userId = cookieData.ds_user_id;

      isStopped = false;
      isPaused = false;
      document.getElementById('pauseBtn').disabled = false;
      document.getElementById('stopBtn').disabled = false;

      printLog("[SYSTEM] Memulai proses pembersihan...", "#00ff00");

      async function fetchList(type) {
        let list = [];
        let maxId = '';
        printLog(`[SCAN] Membaca data ${type}...`, "#ffcc00");

        while (!isStopped) {
          await checkControlState();
          const url = `https://www.instagram.com/api/v1/friendships/${userId}/${type}/?count=100${maxId ? `&max_id=${maxId}` : ''}`;
          
          try {
            const res = await proxyFetch(url);
            if (!res.ok) {
              printLog(`[LIMIT] Batasan server (${res.status}). Tunggu 30s...`, "#ffaa00");
              await new Promise(r => setTimeout(r, 30000));
              continue;
            }

            const data = await res.json();
            if (data.users) list = list.concat(data.users.map(u => ({ id: u.pk, username: u.username })));
            
            maxId = data.next_max_id;
            if (!maxId) break;
            await new Promise(r => setTimeout(r, 1000));
          } catch (e) {
            printLog(`[ERROR SCAN] ${e.message}`, "#dc3545");
            await new Promise(r => setTimeout(r, 5000));
          }
        }
        return list;
      }

      const following = await fetchList('following');
      if (isStopped) return;

      const followers = await fetchList('followers');
      if (isStopped) return;

      let targets = [];
      let endpointUrl = '';

      if (mode === 'REMOVE_FOLLOWERS') {
        const followingIds = new Set(following.map(f => f.id));
        targets = followers.filter(f => !followingIds.has(f.id));
        endpointUrl = (id) => `https://www.instagram.com/api/v1/friendships/remove_follower/${id}/`;
      } else {
        const followerIds = new Set(followers.map(f => f.id));
        targets = following.filter(f => !followerIds.has(f.id));
        endpointUrl = (id) => `https://www.instagram.com/api/v1/web/friendships/${id}/unfollow/`;
      }

      printLog(`[HASIL] Target non-mutual: ${targets.length}`, "#ffcc00");
      if (targets.length === 0) return printLog("[SELESAI] Akun bersih!", "#00ff00");

      for (let i = 0; i < targets.length; i++) {
        await checkControlState();
        if (isStopped) break;

        const target = targets[i];

        try {
          const res = await proxyFetch(endpointUrl(target.id), 'POST', 'container_module=profile');
          const data = await res.json();

          if (res.ok && data.status === 'ok') {
            printLog(`[${i + 1}/${targets.length}] Sukses: @${target.username}`, "#00ff00");
          } else {
            printLog(`[GAGAL] @${target.username} (${res.status})`, "#dc3545");
          }
        } catch (e) {
          printLog(`[ERROR] ${e.message}`, "#dc3545");
        }

        if ((i + 1) % 10 === 0 && i !== targets.length - 1) {
          const wait = Math.floor(Math.random() * 15000) + 60000;
          printLog(`Batch 10 selesai. Cooldown ${Math.round(wait/1000)}s...`, "#f1c40f");
          await new Promise(r => setTimeout(r, wait));
        } else if (i !== targets.length - 1) {
          const itemWait = Math.floor(Math.random() * 2000) + 3000;
          await new Promise(r => setTimeout(r, itemWait));
        }
      }

      printLog("[SELESAI] Seluruh proses selesai!", "#00ff00");
    }
  </script>
</body>
</html>
